[project]
name = "local-llm"
version = "0.3.0"
description = "A Viam module for inferencing a local LLM."
authors = [
    { name = "Nick hehr", email = "nick.hehr@viam.com" }
]
dependencies = [
    # Pinned so prebuilt wheels and CUDA source builds use the same llama.cpp. Newer model
    # families need a newer llama.cpp: bump this, and check that
    # https://abetlen.github.io/llama-cpp-python/whl/cpu has wheels for the version.
    "llama-cpp-python==0.3.36",
    "viam-sdk>=0.82.0",
    "numpy>=1.26.2",
    "chat-service-api @ git+https://github.com/viam-labs/chat-service-api.git@v0.1.3",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.scripts]
"local-llm" = "local_llm:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.rye]
managed = true
dev-dependencies = []
